{% extends 'base.html' %}

{% block title %}Access Denied (403) - Cross Booking{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger">403</h1>
        <h3 class="fw-bold mb-3">Unauthorized Access</h3>
        <p class="text-muted col-md-6 mx-auto mb-4">
            You do not have the required permissions or role privileges to view this portal or resource.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard_redirect' %}" class="btn btn-primary px-4">
                <i class="bi bi-speedometer2 me-1"></i> Go to My Dashboard
            </a>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-house me-1"></i> Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
