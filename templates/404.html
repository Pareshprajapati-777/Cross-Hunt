{% extends 'base.html' %}

{% block title %}Page Not Found (404) - Cross Booking{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h3 class="fw-bold mb-3">Cross Venue or Page Not Found</h3>
        <p class="text-muted col-md-6 mx-auto mb-4">
            The page or Cross property you are looking for might have been moved, deactivated, or does not exist.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary px-4">
            <i class="bi bi-house me-1"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
