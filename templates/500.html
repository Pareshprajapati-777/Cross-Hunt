{% extends 'base.html' %}

{% block title %}Server Error (500) - Cross Booking{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-warning">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted col-md-6 mx-auto mb-4">
            An unexpected error occurred while processing your request. Our technical staff has been notified.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary px-4">
            <i class="bi bi-house me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
